<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议纪要</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#111827;}
    main{max-width:860px;margin:0 auto;padding:24px 16px 48px;}
    h1{font-size:24px;margin:0 0 8px;}
    .meta{color:#64748b;font-size:13px;margin-bottom:16px;}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px;}
    a.button{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;background:#2563eb;color:white;text-decoration:none;font-size:14px;font-weight:700;}
    section{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-top:14px;}
    pre{white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:14px;margin:0;}
  </style>
</head>
<body>
<main>
  <h1 id="title">会议纪要</h1>
  <div id="meta" class="meta">正在加载会议纪要...</div>
  <div class="actions">
    <a id="downloadLink" class="button" href="#">下载 Markdown</a>
  </div>
  <section><pre id="minutes">正在加载...</pre></section>
</main>
<script>
const meetingId = decodeURIComponent(location.pathname.replace(/^\/share\/?/, "").replace(/\/+$/, ""));
const title = document.getElementById("title");
const meta = document.getElementById("meta");
const minutes = document.getElementById("minutes");
const downloadLink = document.getElementById("downloadLink");

async function loadMinutes() {
  if (!meetingId) {
    meta.textContent = "缺少会议 ID。";
    minutes.textContent = "";
    return;
  }
  title.textContent = "会议纪要";
  meta.textContent = "会议 ID：" + meetingId;
  downloadLink.href = "/api/meetings/" + encodeURIComponent(meetingId) + "/minutes.md";
  const res = await fetch(downloadLink.href);
  const text = await res.text();
  if (!res.ok) {
    meta.textContent = "会议纪要加载失败。";
    minutes.textContent = text || "请确认会议是否存在。";
    return;
  }
  minutes.textContent = text;
}

loadMinutes();
</script>
</body>
</html>
